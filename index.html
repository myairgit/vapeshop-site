<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Air Vape Shop</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="adminPanel" class="hidden">
  <h3>Admin Panel</h3>

  <input id="productName" placeholder="Nazwa">
  <input id="productPrice" placeholder="Cena">
  <input id="productImage" placeholder="Image URL">

  <button id="addProduct">Dodaj produkt</button>
</div>
<div id="agePopup">
  <div class="age-box">
    <h2>Czy masz ukończone 18 lat?</h2>
    <p>Strona przeznaczona tylko dla osób pełnoletnich.</p>
    <button onclick="enter()">TAK</button>
    <button>NIE</button>
  </div>
</div>

<header>

<div class="logo">
  <img src="logo2.png">
</div>

<nav>
  <a href="index.html">Strona główna</a>
  <a href="products.html">Produkty</a>
  <a href="contact.html">Kontakt</a>
</nav>

<!-- 🔐 AUTH BUTTON -->
<div class="auth-btn" onclick="openAuth()">Login</div>

</header>

<section class="hero">
  <h1>MY AIR</h1>
  <p>Najlepszy vape shop w kosmicznym stylu</p>
</section>

<section class="products">
  <h2>Produkty</h2>
  <div id="products" class="grid"></div>
</section>

<!-- 🔐 AUTH MODAL -->
<div id="authModal" class="modal hidden">
  <div class="modal-box">

    <h2>Account</h2>

    <!-- 👇 ФОРМА -->
    <div id="authForm">
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">

      <div class="buttons">
        <button id="signin">Login</button>
        <button id="signup">Register</button>
      </div>
    </div>

    <!-- 👇 ПОЛЬЗОВАТЕЛЬ -->
    <div id="userPanel" class="hidden">
      <p id="userEmail"></p>
      <button id="signout" class="logout">Logout</button>
    </div>

    <span class="close" onclick="closeAuth()">✕</span>

  </div>
</div>

<footer>
<p>© 2026 My Air Vape Shop</p>
<p>Sprzedaż tylko dla osób powyżej 18 lat</p>
</footer>
<script type="module" src="js/app.js"></script>

</body>
</html>
