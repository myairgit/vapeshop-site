<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Air Vape Shop</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="agePopup">
  <div class="age-box">
    <h2>Czy masz ukończone 18 lat?</h2>
    <p>Strona przeznaczona tylko dla osób pełnoletnich.</p>
    <button onclick="enter()">TAK</button>
    <button>NIE</button>
  </div>
</div>

<header>

<div class="logo">
  <img src="logo2.png">
</div>

<nav>
  <a href="#">Strona główna</a>
  <a href="#">Produkty</a>
  <a href="#">Liquidy</a>
  <a href="#">Jednorazówki</a>
  <a href="#">Kontakt</a>
</nav>

<!-- 🔐 AUTH BUTTON -->
<div class="auth-btn" onclick="openAuth()">Login</div>

</header>

<!-- 🔥 HERO (можно оставить как у тебя было) -->
<section class="hero">
  <h1>MY AIR</h1>
  <p>Najlepszy vape shop w kosmicznym stylu</p>
</section>

<!-- 🔥 PRODUCTS -->
<section class="products">
  <h2>Produkty</h2>
  <div id="products" class="grid"></div>
</section>

<!-- 🔐 AUTH MODAL -->
<div id="authModal" class="modal hidden">
  <div class="modal-box">

    <h2>Account</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <div class="buttons">
      <button id="signin">Login</button>
      <button id="signup">Register</button>
    </div>

    <button id="signout" class="logout">Logout</button>

    <span class="close" onclick="closeAuth()">✕</span>

  </div>
</div>

<footer>
<p>© 2026 My Air Vape Shop</p>
<p>Sprzedaż tylko dla osób powyżej 18 lat</p>
</footer>

<!-- 🔥 ВАЖНО: скрипт внизу -->
<script type="module" src="js/app.js"></script>

</body>
</html>
